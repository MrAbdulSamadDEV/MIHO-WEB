<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="chromeGradA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="75%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <linearGradient id="chromeGradB" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#94A3B8" />
      <stop offset="65%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <radialGradient id="specularDot" cx="45%" cy="30%" r="30%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="128" height="128" rx="28" fill="#000000" />
  <rect width="126" height="126" x="1" y="1" rx="27" fill="none" stroke="#27272A" stroke-width="1.5" />

  <!-- MIHO Signature Liquid Chrome Torus Knot -->
  <g transform="translate(14, 14) scale(0.78)" filter="url(#softGlow)">
    <!-- Base Ribbon -->
    <path
      d="M 64 20 C 88 20 108 40 108 64 C 108 88 88 108 64 108 C 40 108 20 88 20 64 C 20 40 40 20 64 20 Z"
      fill="none"
      stroke="url(#chromeGradA)"
      stroke-width="18"
      stroke-linecap="round"
    />
    <!-- Intertwining Dynamic Ribbon Fold -->
    <path
      d="M 32 36 C 50 16 78 16 96 36 C 114 56 114 84 96 104 C 78 124 50 124 32 104"
      fill="none"
      stroke="url(#chromeGradB)"
      stroke-width="12"
      stroke-linecap="round"
      opacity="0.95"
    />
    <!-- Specular Highlight Sheen -->
    <path
      d="M 44 26 C 60 16 80 18 92 30"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="3"
      stroke-linecap="round"
      opacity="0.9"
    />
    <circle cx="56" cy="24" r="3" fill="#FFFFFF" opacity="0.9" />
  </g>
</svg>