<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page Not Found | MIHO</title>
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/png" href="/assets/icon.png" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
    <style>
      body {
        margin: 0;
        background: #000000;
        color: #ffffff;
        font-family: 'Inter', sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      .card {
        max-width: 480px;
        background: rgba(14, 14, 14, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 20px;
        padding: 40px 32px;
        backdrop-filter: blur(20px);
      }
      h1 {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 72px;
        margin: 0 0 10px;
        line-height: 1;
        letter-spacing: -0.05em;
      }
      h2 {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 22px;
        font-weight: 500;
        margin: 0 0 16px;
        color: #e5e5e5;
      }
      p {
        color: #888888;
        font-size: 14px;
        line-height: 1.6;
        margin: 0 0 28px;
      }
      .btn {
        display: inline-block;
        padding: 12px 28px;
        background: #ffffff;
        color: #050505;
        font-family: 'Space Grotesk', sans-serif;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        border-radius: 9999px;
        text-decoration: none;
        transition: transform 0.2s;
      }
      .btn:hover {
        transform: scale(1.03);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div style="font-size: 10px; font-family: monospace; letter-spacing: 0.2em; color: #888; margin-bottom: 12px;">
        ERROR 404
      </div>
      <h1>404</h1>
      <h2>Dimension Not Found</h2>
      <p>
        The page you are looking for does not exist in the MIHO system. Let us return to the primary world.
      </p>
      <a href="/" class="btn">RETURN TO MIHO</a>
    </div>
  </body>
</html>
